<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dimui — Component explorer</title>
    <!--
      Sync-load Dim from the GitHub Pages CDN (classic IIFE → window.Dim)
      before runtime.js installs the data: import-map shim for ESM.
    -->
    <script>
      (function () {
        var DIM_LIB = "https://positive-intentions.github.io/dim/lib/";
        var impl = "js";
        try {
          var q = (new URLSearchParams(location.search || "").get("impl") || "")
            .toLowerCase();
          if (q === "js" || q === "wasm") {
            impl = q;
          } else if (window.parent !== window) {
            try {
              var parentImpl =
                window.parent.document.documentElement.dataset.dimRuntime || "";
              if (parentImpl === "js" || parentImpl === "wasm") impl = parentImpl;
            } catch (_) {}
          }
        } catch (_) {}
        document.documentElement.dataset.dimRuntime = impl;
        var src =
          impl === "wasm"
            ? DIM_LIB + "dim.wasm.global.js"
            : DIM_LIB + "dim.global.js";
        document.write('<script src="' + src + '"><\/script>');
      })();
    </script>
    <script src="./runtime.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      dimui-manager {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <dimui-manager></dimui-manager>
    <script type="module" src="./app.js"></script>
  </body>
</html>
